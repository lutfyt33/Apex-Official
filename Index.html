<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APEX OFFICIAL</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/loading.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/buttons.css" />
    <link rel="stylesheet" href="css/glitch.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
    <div id="app">
        <!-- LOADING SCREEN -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-header">
                <h1 class="brand">APEX OFFICIAL</h1>
                <div class="loading-indicator">
                    <span class="spinner"></span>
                    <span id="loadingText">loading sistem informasi</span>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="loading-status" id="loadingStatus">0%</div>
        </div>

        <!-- PROFILE SCREEN -->
        <div id="profileScreen" class="profile-screen">
            <div class="profile-container">
                <div class="avatar" id="avatar">AP</div>
                <h2 class="welcome-text">welcome to website resmi nya Apex Official Project</h2>
                <div class="project-grid" id="projectGrid"></div>
                <p class="footer-note">© 2026 Apex Official · all rights reserved</p>
            </div>
        </div>
    </div>

    <!-- GLITCH OVERLAY -->
    <div id="glitchOverlay" class="glitch-overlay"></div>

    <!-- JAVASCRIPT -->
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/events.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/glitch.js"></script>
    <script src="js/router.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
